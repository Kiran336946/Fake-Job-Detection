<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Fake Job Detection</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        <div class="logo-icon">
            🛡
        </div>

        <div class="logo-text">
            <strong>Fake Job</strong>
            <span>Detection</span>
        </div>

    </div>


    <a href="{{ url_for('home') }}" class="back-home">
        ← Back to Home
    </a>

</header>



<!-- ================= LOGIN ================= -->

<main class="login-container">


    <div class="login-card">


        <div class="login-icon">
            🛡️
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="login-subtitle">
            Login to your Fake Job Detection account
        </p>



        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>



            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>



            <!-- OPTIONS -->

            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember">

                    <span>
                        Remember me
                    </span>

                </label>


                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-submit">

                Login

            </button>


        </form>



        <!-- MESSAGE -->

        <div
            id="loginMessage"
            class="login-message">
        </div>



        <!-- SIGN UP -->

        <p class="signup-text">

            Don't have an account?

        <a href="{{ url_for('signup') }}">Create Account</a>

        </p>


    </div>
    </div>

<!--Right side image for login page -->
    <div class="login-image">

        <img src="{{ url_for('static', filename='image/login-side.png') }}"
             alt="Fake Job Detection">

    </div>


</main>


</main>



<!-- ================= FOOTER ================= -->


<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
